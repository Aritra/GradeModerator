<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>BITS Pilani Grade Moderator</title>
    <style>
        .footer {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            padding-top: 10px;
            background-color: navy;
            color: white;
            text-align: center;
        }
        .btn-dark-orange {
            background-color: #cc7000;
            color: white;
        }
        .btn-dark-orange:hover {
            background-color: #a85c00;
            color: white;
        }
        /*
         * Button row: inside the same col-sm-10 as the art, with margins equal to the
         * art's blank edges (measured: 6.45% left, 7.65% right of the image width),
         * so the row lines up with the visible artwork end to end.
         */
        .home-buttons {
            display: flex; flex-wrap: wrap; gap: 1rem;
            margin: 0 7.65% 10px 6.45%;
        }
        .home-buttons .btn { flex: 1 1 0; min-width: 9rem; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-1"></div>
            <div class="col-sm-10">
                <img src="imgs/moderator_art_2.svg" class="mx-auto d-block" style="width:100%">
            </div>
            <div class="col-sm-1"></div>
        </div>

        <!-- Three equal buttons, small gaps, spanning the art above end to end -->
        <div class="row">
            <div class="col-sm-1"></div>
            <div class="col-sm-10">
                <div class="home-buttons">
                    <button type="button" class="btn btn-primary btn-lg"
                        onclick="location.href='new_grade_updated.html'">
                        New Grade
                    </button>
                    <button type="button" class="btn btn-success btn-lg"
                        onclick="location.href='view_grade.html'">
                        View Grades
                    </button>
                    <button type="button" class="btn btn-dark-orange btn-lg"
                        onclick="window.open('help.html', '_blank')">
                        Help
                    </button>
                </div>
            </div>
            <div class="col-sm-1"></div>
        </div>
    </div>

    <div class="footer">
    <p style="color:darkgrey;">
        New to the system? You may watch the
        <a href="https://youtu.be/-dX6KwiFTj4" target="_blank">YouTube tutorial</a> before proceeding.
        You may also refer the 
        <a href="help.html" target="_blank">Help Documentation</a>.
        <br>
        For any bug report or suggestions please mail to
        <a href="mailto:a.mukherjee@hyderabad.bits-pilani.ac.in">
            Aritra Mukherjee, Dept. of CSIS, Hyd Campus
        </a>
    </p>
    </div>
</body>
</html>
