<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>BITS Pilani Grade Moderator</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-2"></div>
            <div class="col-sm-8">
                <div style="padding-top:15px; padding-bottom:15px;">
                    <h1>View Existing Grades</h1>
                    <p>Choose the saved JSON file containing all details for the grades.</p>
                </div>
                <img src="imgs/separator.svg" class="mx-auto d-block" style="width:100%">
                <div style="padding-top: 15px;">
                    <!-- Form to upload a previously saved grade JSON file -->
                    <form id="formJSON">
                        <input type="file" id="UploadJsonFile" accept=".json" autocomplete="off" style="width: 79.5%;"/>
                        <input type="submit" class="btn btn-primary" name="submit" style="width: 20%;"/>
                    </form>
                    <p id="demo" style="padding-top: 15px;"></p>
                </div>
            </div>
            <div class="col-sm-2"></div>
        </div>
    </div>

    <script>
        const formJSON   = document.getElementById("formJSON");
        const jsonFile   = document.getElementById("UploadJsonFile");
        const demo       = document.getElementById("demo");

        // Clear the chosen file every time the page is shown, including when it is
        // reached with the browser's Back button, so an earlier file is not reused
        window.addEventListener('pageshow', () => { jsonFile.value = ''; demo.innerHTML = ''; });

        /**
         * Key used to match student IDs: year (chars 1-4) + roll number + campus part
         * (chars 9 on; the campus part is one letter, or GH / HP / GHP ... for transfer
         * students), ignoring the programme code, case and spaces. Same helper as in
         * new_grade_updated.html and histogram.html.
         */
        function idMatchKey(id) {
            const clean = String(id).trim().toUpperCase();
            return clean.length >= 13 && clean.length <= 15 ? clean.slice(0, 4) + clean.slice(8) : clean;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        /** IDs (as saved) of students listed more than once across mMap and specialGMap. */
        function duplicateStudentIds(gradesDetails) {
            const seen = new Map(), dups = new Set();
            [...(gradesDetails.mMap || []), ...(gradesDetails.specialGMap || [])].forEach(row => {
                const key = idMatchKey(row[0]);
                if (seen.has(key)) dups.add(seen.get(key));
                else seen.set(key, String(row[0]).trim());
            });
            return [...dups];
        }

        /**
         * On form submit: read the JSON file, store it in sessionStorage,
         * then navigate to the histogram page.
         */
        formJSON.addEventListener("submit", function (e) {
            e.preventDefault();
            const input  = jsonFile.files[0];
            if (!input) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                let gradesDetails;
                try {
                    gradesDetails = JSON.parse(e.target.result);
                } catch (err) {
                    demo.innerHTML = "❌ This file is not a valid grades JSON file.";
                    return;
                }
                // The same student twice would be counted twice in the histogram and MGPV
                const dups = duplicateStudentIds(gradesDetails);
                if (dups.length > 0) {
                    demo.innerHTML = `❌ This file lists ${dups.length} student(s) more than once ` +
                        `(${dups.slice(0, 3).map(escapeHtml).join(', ')}${dups.length > 3 ? ', …' : ''}), ` +
                        `so it cannot be opened. Please create the grades again from the marks and ERP files.`;
                    jsonFile.value = '';
                    return;
                }
                sessionStorage.setItem("gradeObject", JSON.stringify(gradesDetails));
                window.open("histogram.html", "_self");
            };
            reader.readAsText(input);
        });
    </script>
</body>
</html>
